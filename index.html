<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scheda Palestra AMOLED</title>
<style>
/* =========================================================
   SISTEMA DI DESIGN AMOLED S26 - PITCH BLACK & NEON ACCENTS
   ========================================================= */
:root {
  --bg: #000000;
  --surface: #0a0d12;
  --surface-2: #121720;
  --surface-3: #1a2230;
  --line: #1e2838;
  --line-strong: #2d3b52;
  --text: #f0f4f9;
  --text-dim: #8899af;
  --text-muted: #5a6d85;
  --gold: #ffd166;
  --gold-dim: rgba(255, 209, 102, 0.15);
  --gold-glow: rgba(255, 209, 102, 0.35);
  --green: #00e676;
  --green-dim: rgba(0, 230, 118, 0.16);
  --green-glow: rgba(0, 230, 118, 0.35);
  --red: #ff4d6d;
  --red-dim: rgba(255, 77, 109, 0.15);
  
  /* Colore primario dinamico per giorno */
  --accent: #00e5ff;
  --accent-dim: rgba(0, 229, 255, 0.12);
  --accent-glow: rgba(0, 229, 255, 0.28);
  --accent-text: #80f2ff;
  
  --radius-xl: 18px;
  --radius-lg: 14px;
  --radius-md: 10px;
  --radius-sm: 8px;
  --tap: 46px;
  font-size: 16px;
}

body[data-day="lun"] {
  --accent: #00e5ff; /* Electric Cyan */
  --accent-dim: rgba(0, 229, 255, 0.12);
  --accent-glow: rgba(0, 229, 255, 0.3);
  --accent-text: #80f2ff;
}
body[data-day="mar"] {
  --accent: #00ff87; /* Acid / Neon Lime */
  --accent-dim: rgba(0, 255, 135, 0.12);
  --accent-glow: rgba(0, 255, 135, 0.3);
  --accent-text: #7effbe;
}
body[data-day="gio"] {
  --accent: #ff8c00; /* Hyper Orange Flame */
  --accent-dim: rgba(255, 140, 0, 0.14);
  --accent-glow: rgba(255, 140, 0, 0.32);
  --accent-text: #ffbf75;
}
body[data-day="ven"] {
  --accent: #b388ff; /* Royal Purple / Indigo */
  --accent-dim: rgba(179, 136, 255, 0.13);
  --accent-glow: rgba(179, 136, 255, 0.3);
  --accent-text: #dcc2ff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Samsung Sans", Helvetica, Arial, sans-serif;
  line-height: 1.45;
  padding-bottom: calc(130px + env(safe-area-inset-bottom));
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
}
input, button, select { font-family: inherit; font-size: 1rem; color: inherit; }
button { background: none; border: none; cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- TOPBAR ERGONOMICA S26 ---------- */
header {
  position: sticky; top: 0; z-index: 40;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
  transition: border-color .3s;
}
.bar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 10px 16px 8px;
}
.title-box { flex: 1; min-width: 0; }
.title-box h1 {
  font-size: 1.15rem; font-weight: 750; margin: 0;
  letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;
}
.title-box h1 .tag-active {
  font-size: 0.68rem; font-weight: 800; text-transform: uppercase;
  padding: 3px 7px; border-radius: 6px;
  background: var(--accent-dim); color: var(--accent);
  border: 1px solid var(--accent-glow);
}
.title-box p { font-size: 0.74rem; color: var(--text-dim); margin: 2px 0 0; }
.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 1.15rem; color: var(--text);
  transition: transform .1s, background .15s;
}
.icon-btn:active { transform: scale(0.92); background: var(--surface-3); }

/* Day Tabs */
.days {
  display: flex; gap: 8px; padding: 4px 16px 12px;
  overflow-x: auto; scrollbar-width: none;
}
.days::-webkit-scrollbar { display: none; }
.day-tab {
  flex: 1 0 auto; min-width: 78px; padding: 8px 10px; border-radius: var(--radius-md);
  background: var(--surface); border: 1px solid var(--line);
  font-size: 0.84rem; font-weight: 700; color: var(--text-dim);
  text-align: center; white-space: nowrap; transition: all .2s;
}
.day-tab span { display: block; font-size: 0.68rem; font-weight: 500; opacity: 0.8; margin-top: 1px; }
.day-tab.active {
  background: var(--accent); border-color: var(--accent);
  color: #000000; font-weight: 800;
  box-shadow: 0 0 16px var(--accent-glow);
}
.day-tab.active span { color: #000000; font-weight: 700; opacity: 0.9; }

/* Micro Progress Bar */
.progress-track { height: 3px; background: #0e131a; }
.progress-track i {
  display: block; height: 100%; background: var(--accent);
  width: 0; transition: width .3s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 0 8px var(--accent);
}

/* Toast */
.toast {
  position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 50%; z-index: 100;
  background: #111722; color: var(--text);
  border: 1px solid var(--accent); font-weight: 700; font-size: 0.84rem;
  padding: 11px 18px; border-radius: 14px;
  display: none; pointer-events: none;
  transform: translate(-50%, 0);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 16px var(--accent-glow);
  white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
}
.toast.on { display: block; animation: toastIn .2s ease; }
@keyframes toastIn { from { transform: translate(-50%, -10px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* Quick session bar */
.session-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin: 12px 14px; padding: 12px 16px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-lg);
}
.session-date { display: flex; flex-direction: column; }
.session-date label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
.session-date input[type=date] {
  background: transparent; border: none; padding: 0;
  font-size: 0.96rem; font-weight: 750; color: var(--text);
  color-scheme: dark;
}
.session-metrics { display: flex; align-items: center; gap: 14px; text-align: right; }
.metric-col small { display: block; font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
.metric-col b { font-size: 1rem; font-weight: 800; color: var(--accent-text); }

.day-note-box {
  margin: 0 14px 12px; padding: 12px 15px; border-radius: var(--radius-lg);
  background: var(--surface-2); border: 1px solid var(--line-strong);
  font-size: 0.82rem; color: #d0d7e2; display: flex; gap: 9px; align-items: flex-start;
}
.day-note-box span { font-size: 1.1rem; line-height: 1; }

/* ---------- EXERCISE CARDS ---------- */
.ex-card {
  margin: 0 14px 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius-xl);
  overflow: hidden; transition: border-color .2s, box-shadow .2s;
  position: relative;
}
.ex-card.done {
  border-color: rgba(0, 230, 118, 0.45);
  background: linear-gradient(180deg, rgba(0, 230, 118, 0.04) 0%, var(--surface) 100%);
}
.ex-card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 10px; padding: 14px 15px 10px;
}
.ex-main { flex: 1; min-width: 0; }
.ex-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ex-title { font-size: 1.02rem; font-weight: 750; color: var(--text); line-height: 1.25; }
.eq-badge {
  font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
  padding: 2px 7px; border-radius: 6px;
  background: var(--surface-3); color: var(--text-dim); border: 1px solid var(--line-strong);
}
.variant-chip-active {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.72rem; color: var(--accent); font-weight: 700;
  margin-top: 4px; background: var(--accent-dim);
  padding: 2px 8px; border-radius: 6px;
}
.ex-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 6px; font-size: 0.76rem; color: var(--text-dim); font-weight: 600;
}
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 4px; }
.dot.heavy { background: var(--red); box-shadow: 0 0 6px var(--red); }
.dot.medium { background: var(--gold); }
.dot.light { background: var(--green); }

.head-actions { display: flex; gap: 6px; }
.mini-icon-btn {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 0.9rem; color: var(--text-dim);
  font-weight: 700;
}
.mini-icon-btn:active { background: var(--surface-3); color: var(--text); }

/* Tips and Smart Suggestion */
.tip-box {
  margin: 0 14px 10px; padding: 10px 13px;
  background: var(--surface-2); border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.8rem; color: #c4d0df; line-height: 1.45; display: none;
}
.tip-box.open { display: block; }

.smart-advise {
  margin: 0 14px 10px; padding: 10px 13px; border-radius: var(--radius-md);
  background: rgba(255, 209, 102, 0.08); border: 1px solid rgba(255, 209, 102, 0.3);
  font-size: 0.8rem; color: #ffe299; display: flex; gap: 8px; align-items: flex-start;
}
.smart-advise.increase {
  background: var(--accent-dim); border-color: var(--accent-glow); color: var(--accent-text);
}
.smart-advise.warning {
  background: var(--red-dim); border-color: rgba(255, 77, 109, 0.35); color: #ff94a8;
}
.smart-advise-icon { font-size: 1rem; line-height: 1; flex-shrink: 0; }

/* ---------- SET TABLE CON STEPPERS INTEGRATI ---------- */
.sets-wrap { padding: 0 8px 10px; }
.set-header {
  display: grid; grid-template-columns: 24px 1fr 1fr var(--tap);
  gap: 6px; padding: 4px 6px 6px;
  font-size: 0.68rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 0.5px;
}
.set-row {
  display: grid; grid-template-columns: 24px 1fr 1fr var(--tap);
  gap: 6px; align-items: center; padding: 5px 4px;
  border-radius: var(--radius-md); transition: background .15s;
}
.set-row.done {
  background: rgba(0, 230, 118, 0.06);
}
.set-idx {
  font-size: 0.84rem; font-weight: 850; color: var(--text-muted);
  text-align: center;
}
.set-row.done .set-idx { color: var(--green); }

/* Stepper Integrato (Bottone Meno - Campo - Bottone Più) */
.stepper-box {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--radius-md); height: var(--tap);
  position: relative; overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.stepper-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}
.set-row.pr .stepper-box {
  border-color: var(--gold); box-shadow: 0 0 8px var(--gold-glow);
}
.pr-badge {
  position: absolute; top: -6px; left: -4px; z-index: 3;
  font-size: 0.75rem; line-height: 1;
}

/* Pulsanti Più e Meno per dita e mouse */
.step-btn {
  width: 32px; height: 100%; display: grid; place-items: center;
  font-size: 1.15rem; font-weight: 850; color: var(--text-dim);
  background: rgba(255, 255, 255, 0.02); user-select: none; flex-shrink: 0;
  transition: background .12s, color .12s;
}
.step-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.07); }
.step-btn:active { background: var(--accent-dim); color: var(--accent-text); transform: scale(0.92); }

.stepper-box input {
  flex: 1; min-width: 0; height: 100%; background: transparent; border: none;
  font-size: 1.05rem; font-weight: 750; text-align: center;
  padding: 0 2px; color: var(--text);
}
.stepper-box input:focus { outline: none; }
.stepper-box input::placeholder { color: #435164; font-weight: 600; font-size: 0.92rem; }

/* Check Button con Spunta sempre visibile */
.chk-btn {
  width: var(--tap); height: var(--tap); border-radius: var(--radius-md);
  background: var(--surface-2); border: 1px solid var(--line-strong);
  display: grid; place-items: center; font-size: 1.3rem; font-weight: 900;
  color: #55687f; /* Spunta visibile grigia quando non fatta */
  transition: all .15s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: pointer;
}
.chk-btn:hover { border-color: var(--accent); color: var(--text); }
.chk-btn:active { transform: scale(0.88); }
.set-row.done .chk-btn {
  background: var(--green); border-color: var(--green);
  color: #000000; box-shadow: 0 0 16px var(--green-glow);
}

/* Quick Chips sotto la card */
.quick-steppers {
  display: flex; align-items: center; gap: 6px; padding: 6px 4px 8px;
  overflow-x: auto; scrollbar-width: none;
}
.quick-steppers::-webkit-scrollbar { display: none; }
.chip-lbl { font-size: 0.68rem; font-weight: 750; color: var(--text-muted); text-transform: uppercase; white-space: nowrap; margin-right: 2px; }
.chip-btn {
  padding: 6px 11px; border-radius: var(--radius-sm);
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 0.75rem; font-weight: 750; color: var(--text-dim);
  white-space: nowrap; flex: 1 0 auto; text-align: center;
  cursor: pointer; transition: background .12s, color .12s;
}
.chip-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--line-strong); }
.chip-btn:active { background: var(--accent-dim); color: var(--accent-text); border-color: var(--accent-glow); transform: scale(0.95); }

/* Ultima volta */
.last-bench {
  font-size: 0.74rem; color: var(--text-dim);
  padding: 8px 10px; margin: 4px 4px 6px;
  background: var(--surface-2); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.last-bench b { color: var(--text); font-weight: 700; }
.btn-copy-prev {
  background: var(--surface-3); border: 1px solid var(--line-strong);
  color: var(--accent-text); font-size: 0.72rem; font-weight: 750;
  padding: 4px 10px; border-radius: 6px; cursor: pointer;
}
.btn-copy-prev:hover { background: var(--accent-dim); }
.btn-copy-prev:active { background: var(--accent); color: #000; }

.card-foot-actions {
  display: flex; gap: 8px; padding: 6px 4px 2px;
}
.action-pill {
  flex: 1; height: 38px; border-radius: var(--radius-md);
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 0.78rem; font-weight: 700; color: var(--text-dim);
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.action-pill:hover { background: var(--surface-3); color: var(--text); }
.action-pill:active { transform: scale(0.96); }

/* ---------- TIMER FLUTTUANTE DA SALA PESI ---------- */
.timer-dock {
  position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom));
  z-index: 60; background: rgba(14, 18, 24, 0.96);
  border: 1px solid var(--accent); border-radius: 20px;
  padding: 12px 16px; display: none; align-items: center; gap: 14px;
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.9), 0 0 20px var(--accent-glow);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.timer-dock.on { display: flex; animation: slideUp .25s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.timer-digits {
  font-size: 2.1rem; font-weight: 850; letter-spacing: -1px;
  line-height: 1; min-width: 95px; color: var(--text);
}
.timer-details { flex: 1; min-width: 0; }
.timer-status {
  font-size: 0.74rem; font-weight: 800; color: var(--accent);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.timer-label {
  font-size: 0.86rem; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
}
.timer-progress {
  height: 4px; background: var(--surface-3); border-radius: 2px;
  margin-top: 6px; overflow: hidden;
}
.timer-progress i {
  display: block; height: 100%; background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
.timer-ctrls { display: flex; gap: 6px; }
.t-btn {
  padding: 10px 13px; border-radius: var(--radius-md);
  background: var(--surface-3); border: 1px solid var(--line);
  font-size: 0.82rem; font-weight: 750; color: var(--text);
}
.t-btn:active { transform: scale(0.92); }
.t-btn.danger { color: var(--red); border-color: rgba(255, 77, 109, 0.4); }

/* Fine allenamento */
.celebrate-card {
  margin: 16px 14px 24px; padding: 20px 18px; border-radius: var(--radius-xl);
  background: linear-gradient(135deg, rgba(0, 230, 118, 0.12) 0%, rgba(0, 229, 255, 0.08) 100%);
  border: 1px solid rgba(0, 230, 118, 0.4); text-align: center;
}
.celebrate-card h2 { margin: 0 0 6px; font-size: 1.3rem; font-weight: 850; color: #ffffff; }
.celebrate-card p { margin: 0 0 16px; font-size: 0.85rem; color: #c4d5e7; }
.stat-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;
}
.stat-item {
  background: rgba(0,0,0,0.4); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 10px 6px;
}
.stat-item small { display: block; font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; font-weight: 700; }
.stat-item b { display: block; font-size: 1.1rem; font-weight: 850; color: var(--accent-text); margin-top: 2px; }

/* Sheets */
.sheet-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
  z-index: 70; display: none;
}
.sheet-backdrop.on { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  max-height: 88vh; overflow-y: auto; background: #0c1017;
  border-radius: 24px 24px 0 0; border-top: 1px solid var(--line-strong);
  padding: 20px 18px calc(32px + env(safe-area-inset-bottom));
  display: none;
}
.sheet.on { display: block; animation: sheetUp .24s ease-out; }
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet-handle {
  width: 44px; height: 5px; border-radius: 3px;
  background: var(--line-strong); margin: 0 auto 16px;
}
.sheet h2 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 800; }
.sheet .sheet-sub { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 16px; }

.hist-item { border-top: 1px solid var(--line); padding: 12px 0; }
.hist-item-top { display: flex; align-items: center; justify-content: space-between; }
.hist-item b { font-size: 0.88rem; font-weight: 750; }
.hist-item p { margin: 4px 0 0; font-size: 0.86rem; color: #cfd8e5; }

.btn-large {
  width: 100%; height: 52px; border-radius: var(--radius-lg);
  background: var(--surface-2); border: 1px solid var(--line-strong);
  font-size: 0.95rem; font-weight: 750; color: var(--text);
  margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
}
.btn-large:hover { background: var(--surface-3); }
.btn-large:active { transform: scale(0.98); }
.btn-large.primary {
  background: var(--accent); color: #000000; border-color: var(--accent);
  box-shadow: 0 0 18px var(--accent-glow);
}
.btn-large.danger { color: var(--red); border-color: rgba(255, 77, 109, 0.4); }

.chart-box {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-lg); padding: 14px; margin: 12px 0;
}
.chart-title { font-size: 0.78rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; }
.chart-svg { width: 100%; height: 95px; display: block; overflow: visible; }
.chart-legend { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-dim); margin-top: 4px; font-weight: 600; }

.muscle-bar {
  display: grid; grid-template-columns: 95px 1fr 38px; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid #131822;
}
.muscle-name { font-size: 0.84rem; font-weight: 700; color: #dce4ef; }
.muscle-track { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }

PROGRAM.forEach(d => d.ex.forEach(e => MUSCLE_OF[e.id] = e.muscle));

/* =========================================================
   2. STORAGE LOCALE
   ========================================================= */
const KEY = "palestra_v1";
const TKEY = "palestra_timer_v1";
const Store = (() => {
  let mem = null, ok = true;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
  catch(e){ ok = false; }
  return {
    persistent: ok,
    load(){
      if(mem) return mem;
      try{ mem = JSON.parse(localStorage.getItem(KEY)) || {sessions:{}}; }
      catch(e){ mem = {sessions:{}}; }
      if(!mem.sessions) mem.sessions = {};
      return mem;
    },
    save(){ if(!ok) return; try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){} },
    replace(obj){ mem = obj; this.save(); }
  };
})();

/* =========================================================
   3. STATO & LOGICA
   ========================================================= */
const todayISO = () => new Date().toISOString().slice(0,10);
let state = { dayId: guessDay(), date: todayISO() };
function guessDay(){ const map = {1:"lun",2:"mar",4:"gio",5:"ven"}; return map[new Date().getDay()] || "lun"; }
const day = () => PROGRAM.find(d => d.id === state.dayId);
const sessionKey = (date=state.date, dayId=state.dayId) => date + "__" + dayId;

function session(create=false){
  const db = Store.load();
  const k = sessionKey();
  if(!db.sessions[k] && create) db.sessions[k] = {};
  return db.sessions[k] || {};
}
function normalizeRaw(ex, raw){
  if(!raw) return null;
  if(Array.isArray(raw)) return {variant: ex.name, sets: raw};
  return raw;
}
function exEntry(ex, create=false){
  const s = session(create);
  let raw = normalizeRaw(ex, s[ex.id]);
  if(!raw && create){
    raw = {variant: ex.name, sets: Array.from({length:ex.sets}, () => ({w:"",r:"",d:false}))};
  }
  if(raw && create) s[ex.id] = raw;
  return raw;
}

function lastPerformance(ex, variant){
  const db = Store.load();
  const keys = Object.keys(db.sessions)
    .filter(k => k !== sessionKey())
    .filter(k => {
      const raw = normalizeRaw(ex, db.sessions[k][ex.id]);
      return raw && raw.variant === variant && raw.sets.some(s => s.d || s.w || s.r);
    })
    .sort().reverse();
  if(!keys.length) return null;
  const raw = normalizeRaw(ex, db.sessions[keys[0]][ex.id]);
  return { date: keys[0].split("__")[0], sets: raw.sets };
}

function bestWeightBefore(ex, variant){
  const db = Store.load();
  const curKey = sessionKey();
  let best = null;
  Object.keys(db.sessions).forEach(k => {
    if(k === curKey) return;
    const raw = normalizeRaw(ex, db.sessions[k][ex.id]);
    if(!raw || raw.variant !== variant) return;
    raw.sets.forEach(set => {
      const w = parseFloat(set.w);
      if(set.d && !isNaN(w) && (best === null || w > best)) best = w;
    });
  });
  return best;
}

function calc1RM(weight, reps){
  const w = parseFloat(weight) || 0;
  const r = parseFloat(reps) || 0;
  if(!w || !r) return 0;
  if(r === 1) return w;
  return Math.round(w * (1 + r / 30) * 10) / 10;
}

function parseRepRange(reps){
  const clean = String(reps).replace("s","");
  const parts = clean.split("-").map(Number);
  return parts.length === 2 ? parts : [parts[0], parts[0]];
}

function getStepForEx(ex){
  if(ex.eq === "bw") return 2.5;
  if(ex.eq === "machine") return 5;
  if(ex.eq === "dumbbell") return 2;
  return 2.5;
}

function smartAdvisor(ex, variant){
  if(ex.unit === "sec") return null;
  const last = lastPerformance(ex, variant);
  if(!last) return { type: "info", text: "Prima volta con questo esercizio. Trova un carico target con 1-2 ripetizioni di riserva (RIR 1-2)." };
  
  const completed = last.sets.filter(s => s.w !== "" && s.r !== "");
  if(!completed.length) return null;
  
  const [minReps, maxReps] = parseRepRange(ex.reps);
  const weights = completed.map(s => parseFloat(s.w) || 0);
  const reps = completed.map(s => parseFloat(s.r) || 0);
  const maxWeight = Math.max(...weights);
  const avgReps = reps.reduce((a,b)=>a+b,0) / reps.length;
  const allAtTop = reps.every(r => r >= maxReps);
  const tooLow = reps.some(r => r < minReps);
  const step = getStepForEx(ex);

  if(allAtTop){
    const nextWeight = maxWeight + step;
    if(ex.bw && maxWeight === 0){
      return { type: "increase", text: `Top raggiunto (${maxReps} reps). Ottimo momento per mettere <b>+${step} kg di zavorra</b>!` };
    }
    return { type: "increase", text: `Tutte le serie chiuse a ${maxReps} reps! Prova a salire a <b>${nextWeight} kg</b> (+${step} kg).` };
  }

  if(tooLow && avgReps < minReps){
    const reduced = Math.max(0, maxWeight - step);
    return { type: "warning", text: `Troppo pesante l'ultima volta (<${minReps} reps). Valuta di scaricare a <b>${reduced} kg</b> (-${step} kg) per restare nel range ideale.` };
  }

  const target = Math.min(maxReps, Math.ceil(avgReps) + 1);
  return { type: "same", text: `Mantieni <b>${maxWeight} kg</b> e punta a <b>${target} reps</b> su ogni serie.` };
}

/* =========================================================
   4. RENDER UI
   ========================================================= */
const $ = id => document.getElementById(id);

function renderDays(){
  document.body.setAttribute("data-day", state.dayId);
  $("days").innerHTML = PROGRAM.map(d =>
    `<button class="day-tab ${d.id===state.dayId?"active":""}" data-day="${d.id}">
      ${d.tab}<span>${d.tabSub}</span>
    </button>`
  ).join("");
}

function calculateDayVolume(){
  let vol = 0;
  day().ex.forEach(ex => {
    const entry = exEntry(ex);
    if(entry && entry.sets){
      entry.sets.forEach(s => {
        if(s.d){
          const w = parseFloat(s.w) || 0;
          const r = parseFloat(s.r) || 0;
          vol += (w * r);
        }
      });
    }
  });
  return Math.round(vol);
}

  document.body.setAttribute("data-day", state.dayId);

    const entry = exEntry(ex);
    const rows = entry ? entry.sets : Array.from({length:ex.sets},()=>({w:"",r:"",d:false}));

    const isAlt = variant !== ex.name;
    const last = lastPerformance(ex, variant);
    const best = bestWeightBefore(ex, variant);
    const allDone = rows.length && rows.every(s => s.d);
    
    totalSets += rows.length;
    doneSets += rows.filter(s => s.d).length;

    const unit = ex.unit === "sec" ? "sec" : "kg";
    const wPh = ex.bw ? "0" : "0";
    const advice = smartAdvisor(ex, variant);
    const stepVal = getStepForEx(ex);

    let eqLabel = "Libero";
    if(ex.eq === "bw") eqLabel = "Zavorra (+2.5/5)";
    else if(ex.eq === "machine") eqLabel = "Macchina (+5)";
    else if(ex.eq === "dumbbell") eqLabel = "Manubri (+2)";
    else if(ex.eq === "cable") eqLabel = "Cavi (+2.5/5)";
    else if(ex.eq === "barbell") eqLabel = "Bilanciere";

    const setRowsHtml = rows.map((s, i) => {
      const w = parseFloat(s.w);
      const isPR = s.d && best !== null && !isNaN(w) && w > best;
      
      return `
      <div class="set-row ${s.d?"done":""} ${isPR?"pr":""}" data-ex="${ex.id}" data-i="${i}">
        <div class="set-idx num">${i+1}</div>
        
        <!-- Stepper Carico con pulsanti Meno e Più -->
        <div class="stepper-box">
          ${isPR ? '<span class="pr-badge">🏆</span>' : ''}
          <button class="step-btn" data-step-row="w" data-dir="-1" title="Meno carico">–</button>
          <input type="number" inputmode="decimal" step="0.5" class="num w-in" placeholder="${wPh}" value="${s.w}">
          <button class="step-btn" data-step-row="w" data-dir="+1" title="Più carico">+</button>
        </div>

        <!-- Stepper Ripetizioni con pulsanti Meno e Più -->
        <div class="stepper-box">
          <button class="step-btn" data-step-row="r" data-dir="-1" title="Meno reps">–</button>
          <input type="number" inputmode="numeric" class="num r-in" placeholder="${ex.reps}" value="${s.r}">
          <button class="step-btn" data-step-row="r" data-dir="+1" title="Più reps">+</button>
        </div>

        <!-- Checkmark sempre visibile -->
        <button class="chk-btn" aria-label="Spunta serie" title="Spunta serie">✓</button>
      </div>`;
    }).join("");

    // Quick Chips specifici
    let quickChips = "";
    if(ex.eq === "bw"){
      quickChips = `
        <button class="chip-btn" data-step="${ex.id}" data-val="0">0 (Libero)</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+2.5">+2.5 kg</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+5">+5 kg</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+10">+10 kg</button>`;
    } else if(ex.eq === "machine"){
      quickChips = `
        <button class="chip-btn" data-step="${ex.id}" data-val="-5">-5 kg</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+5">+5 kg</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+10">+10 kg</button>`;
    } else {
      quickChips = `
        <button class="chip-btn" data-step="${ex.id}" data-val="-2">-2 kg</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+2">+2 kg</button>
        <button class="chip-btn" data-step="${ex.id}" data-val="+2.5">+2.5 kg</button>`;
    }

    let lastSummary = "";
    if(last && last.sets.length){
      const completedSets = last.sets.filter(s => s.w || s.r);
      const setsStr = completedSets.map(s => `${s.w||"0"}×${s.r||"0"}`).join("  ·  ");

      <div class="last-bench">

    let adviceHtml = "";
    if(advice){
      let icon = "💡";
      if(advice.type === "increase") icon = "🚀";
      else if(advice.type === "warning") icon = "⚠️";
      adviceHtml = `<div class="smart-advise ${advice.type}"><span class="smart-advise-icon">${icon}</span><div>${advice.text}</div></div>`;

    return `
    <section class="ex-card ${allDone?"done":""}" data-ex="${ex.id}">
      <div class="ex-card-head">
        <div class="ex-main">
          <div class="ex-title-row">
            <span class="ex-title">${ex.name}</span>
            <span class="eq-badge">${eqLabel}</span>
          </div>
          ${isAlt ? `<div class="variant-chip-active">Variante: ${variant}</div>` : ""}
          <div class="ex-meta">
            <span class="num">${ex.sets} × ${ex.reps}</span>
            <span><i class="dot ${ex.load}"></i>${ex.loadTxt}</span>
            <span>⏱ ${fmt(ex.rest)}</span>

function updateMetrics(done, total){

const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const dmy = iso => iso.split("-").reverse().slice(0,2).join("/");

/* =========================================================
   5. TIMER IN BACKGROUND & SCHERMO SPENTO
   ========================================================= */
let t = { endTime:null, total:0, label:"", id:null };
let wakeLock = null;
let silentAudioLoop = null;

function initNotifications(){
  if("Notification" in window && Notification.permission === "default"){
    Notification.requestPermission().catch(()=>{});
  }
}
setTimeout(initNotifications, 3000);

async function requestWakeLock(){
  try {
    if("wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
}

function activateBackgroundKeepAlive(label){
  try {
    if(!silentAudioLoop){
      const ctx = getAudioContext();
      const buffer = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      silentAudioLoop = ctx.createBufferSource();
      silentAudioLoop.buffer = buffer;
      silentAudioLoop.loop = true;
      silentAudioLoop.connect(ctx.destination);
      silentAudioLoop.start();
    }
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "Recupero in corso",
        artist: label,
        album: "Scheda Palestra"
      });
      navigator.mediaSession.playbackState = "playing";
    }
  }catch(e){}
}

function deactivateBackgroundKeepAlive(){
  try {
    if(silentAudioLoop){
      silentAudioLoop.stop();
      silentAudioLoop.disconnect();
      silentAudioLoop = null;
    }
    if("mediaSession" in navigator){
      navigator.mediaSession.playbackState = "none";
    }
  }catch(e){}
}

function startTimer(sec, label){
  t.endTime = Date.now() + (sec * 1000);
  t.total = sec;
  t.label = label;
  persistTimer();

  $("timerLbl").textContent = label;
  $("timerDock").classList.add("on");

  requestWakeLock();
  activateBackgroundKeepAlive(label);

  clearInterval(t.id);
  tick();
  t.id = setInterval(tick, 250);
}

function tick(){
  if(!t.endTime) return;
  const left = Math.max(0, Math.round((t.endTime - Date.now()) / 1000));
  $("timerNum").textContent = fmt(left);
  const pct = Math.max(0, Math.min(100, (left / t.total) * 100));
  $("timerRing").style.width = pct + "%";

  if(left <= 0){
    endTimer();
  }
}

function endTimer(){
  clearInterval(t.id);
  const finishLabel = t.label;
  t.endTime = null;
  persistTimer();
  releaseWakeLock();
  deactivateBackgroundKeepAlive();

  playTripleBeep();
  if(navigator.vibrate) navigator.vibrate([350, 150, 350, 150, 500]);

  if("Notification" in window && Notification.permission === "granted"){
    try {
      new Notification("Tempo Scaduto! 🔔", {
        body: `Recupero completato per ${finishLabel}. Tocca alla prossima serie!`,
        icon: "icon-192.png",
        vibrate: [350, 150, 350]
      });
    }catch(e){}
  }

  showToast(`🔔 Recupero completato: ${finishLabel}!`);
  setTimeout(() => $("timerDock").classList.remove("on"), 4000);
}

function stopTimer(){
  clearInterval(t.id);
  t.endTime = null;
  persistTimer();
  releaseWakeLock();
  deactivateBackgroundKeepAlive();
  $("timerDock").classList.remove("on");
}

$("timerStop").onclick = stopTimer;
$("timerAdd").onclick = () => {
  if(!t.endTime) return;
  t.endTime += 30000;
  t.total = Math.max(t.total, Math.round((t.endTime - Date.now()) / 1000));
  persistTimer();
  tick();
  showToast("+30 secondi al recupero");
};

function persistTimer(){
  try{
    if(t.endTime) localStorage.setItem(TKEY, JSON.stringify({endTime:t.endTime, total:t.total, label:t.label}));
    else localStorage.removeItem(TKEY);
  }catch(e){}
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && t.endTime){
    tick();
    if(!wakeLock) requestWakeLock();
  }
});

let audioCtx = null;
function getAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
  return audioCtx;
}

function playTripleBeep(){
  try {
    const ctx = getAudioContext();
    [0, 0.22, 0.44].forEach((delay, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = idx === 2 ? 1046.5 : 880;
      osc.connect(gain);
      gain.connect(ctx.destination);
      
      const startTime = ctx.currentTime + delay;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.4, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.18);
      
      osc.start(startTime);
      osc.stop(startTime + 0.2);
    });
  }catch(e){}
}

document.addEventListener("touchstart", function unlockAudio(){
  try { getAudioContext(); }catch(e){}
  document.removeEventListener("touchstart", unlockAudio);
}, {once:true});

(function checkSavedTimer(){
  try {
    const raw = localStorage.getItem(TKEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(saved.endTime && saved.endTime > Date.now()){
      t.endTime = saved.endTime; t.total = saved.total; t.label = saved.label;
      $("timerLbl").textContent = saved.label;
      $("timerDock").classList.add("on");
      requestWakeLock();
      clearInterval(t.id);
      tick();
      t.id = setInterval(tick, 250);
    } else {
      localStorage.removeItem(TKEY);
    }
  }catch(e){}
})();

  // Stepper Rapido Meno o Più sulla riga della serie

// Stepper singolo su riga: tocco su + o -
function handleRowStep(row, field, dir){
  if(!row || !row.dataset.ex) return;
  const ex = day().ex.find(x => x.id === row.dataset.ex);
  if(!ex) return;
  const entry = exEntry(ex, true);
  const idx = parseInt(row.dataset.i, 10);
  if(!entry || !entry.sets || !entry.sets[idx]) return;
  const s = entry.sets[idx];

  if(navigator.vibrate) { try { navigator.vibrate(15); }catch(e){} }

  if(field === "w"){
    const step = getStepForEx(ex);
    let cur = parseFloat(s.w);
    if(isNaN(cur)){
      const last = lastPerformance(ex, entry.variant);
      cur = (last && last.sets[idx] && parseFloat(last.sets[idx].w)) || 0;
    }
    const next = Math.max(0, Math.round((cur + (dir * step)) * 10) / 10);
    s.w = String(next);
  } else if(field === "r"){
    let cur = parseInt(s.r, 10);
    if(isNaN(cur)){
      const parts = parseRepRange(ex.reps);
      cur = parts[0] || 10;
    }
    const next = Math.max(0, cur + dir);
    s.r = String(next);
  }

  Store.save();
  renderList();
}

// Input manuale da tastiera
document.addEventListener("input", e => {
  const row = e.target.closest(".set-row");
  if(!row || !row.dataset.ex) return;
  const ex = day().ex.find(x => x.id === row.dataset.ex);
  if(!ex) return;
  const entry = exEntry(ex, true);
  const idx = parseInt(row.dataset.i, 10);
  if(!entry || !entry.sets || !entry.sets[idx]) return;

  } else if(e.target.classList.contains("r-in")){
    entry.sets[idx].r = e.target.value;
  }
  Store.save();
  updateMetrics(
    day().ex.reduce((acc, x) => acc + (exEntry(x)?.sets.filter(s=>s.d).length || 0), 0),
    day().ex.reduce((acc, x) => acc + (exEntry(x)?.sets.length || 0), 0)
  );
});

// Spunta serie con haptics e auto-fill
function toggleSet(row){
  if(!row || !row.dataset.ex) return;
  const ex = day().ex.find(x => x.id === row.dataset.ex);
  if(!ex) return;
  const entry = exEntry(ex, true);
  const idx = parseInt(row.dataset.i, 10);
  if(!entry || !entry.sets || !entry.sets[idx]) return;
  const s = entry.sets[idx];
  s.d = !s.d;

  if(s.d){
    if(navigator.vibrate) { try { navigator.vibrate(25); }catch(e){} }

    // Auto-compilazione da serie precedente o sessione scorsa se vuoti
    if(!s.w && !s.r){
      const prev = entry.sets.slice(0, idx).reverse().find(x => x.w || x.r);
      const last = lastPerformance(ex, entry.variant);
      const src = prev || (last && last.sets[idx]) || null;
      if(src){
        s.w = src.w || "";
        s.r = src.r || "";
      } else {
        s.w = ex.bw ? "0" : "10";
        s.r = String(parseRepRange(ex.reps)[0] || 10);
      }
    }

    const best = bestWeightBefore(ex, entry.variant);
    const w = parseFloat(s.w);
    if(best !== null && !isNaN(w) && w > best){
      showToast(`🏆 Nuovo RECORD su ${ex.name}: ${w} kg!`);
      if(navigator.vibrate) { try { navigator.vibrate([100, 50, 200]); }catch(e){} }
    }

    startTimer(ex.rest, ex.name);
  }

  Store.save();
  renderList();
}

function copyLastPerformance(exId){
  const ex = day().ex.find(x => x.id === exId);
  const entry = exEntry(ex, true);
  const last = lastPerformance(ex, entry.variant);
  if(!last || !last.sets.length) return;

  last.sets.forEach((src, i) => {
    if(entry.sets[i]){
      entry.sets[i].w = src.w || "";
      entry.sets[i].r = src.r || "";
    }
  });
  Store.save();
  renderList();
  showToast(`Dati dell'ultima volta replicati su ${ex.name}`);
}

function applyQuickStep(exId, valStr){
  const ex = day().ex.find(x => x.id === exId);
  const entry = exEntry(ex, true);
  const val = parseFloat(valStr);

  entry.sets.forEach(s => {
    if(valStr === "0"){
      s.w = "0";
    } else {
      const cur = parseFloat(s.w) || 0;
      s.w = String(Math.max(0, Math.round((cur + val) * 10) / 10));
    }
  });

  Store.save();
  renderList();
  showToast(`Carico aggiornato (${valStr} kg) su ${ex.name}`);
}

function changeSets(exId, delta){
  const ex = day().ex.find(x => x.id === exId);
  const entry = exEntry(ex, true);
  if(delta > 0 && entry.sets.length < 10) entry.sets.push({w:"",r:"",d:false});
  if(delta < 0 && entry.sets.length > 1) entry.sets.pop();
  Store.save();
  renderList();
}

function buildTrendChart(points){
  if(points.length < 2) return "";
  const w = 320, h = 100, pad = 12;
  const weights = points.map(p => p.val);
  const min = Math.min(...weights);
  const max = Math.max(...weights);
  const range = (max - min) || 1;
  const stepX = (w - 2 * pad) / (points.length - 1);

  const coords = points.map((p, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.val - min) / range) * (h - 2 * pad);
    return [x.toFixed(1), y.toFixed(1)];
  });

  const line = coords.map(c => c.join(",")).join(" ");
  const dots = coords.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="4" fill="var(--accent)" stroke="#000" stroke-width="1.5"/>`).join("");

  return `
  <div class="chart-box">
    <div class="chart-title">Progressione Carico Massimale (kg)</div>
    <svg viewBox="0 0 ${w} ${h}" class="chart-svg">
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div class="chart-legend">
      <span>Min: ${min} kg</span>
      <span>Max: ${max} kg</span>
    </div>
  </div>`;
}

function openHistory(exId){
  const ex = day().ex.find(x => x.id === exId);
  const db = Store.load();
  const entries = Object.keys(db.sessions)
    .map(k => ({k, raw: normalizeRaw(ex, db.sessions[k][exId])}))
    .filter(x => x.raw && x.raw.sets.some(s => s.w || s.r))
    .sort((a,b) => a.k.localeCompare(b.k));

  const todayEntry = exEntry(ex);
  const refVariant = todayEntry ? todayEntry.variant : ex.name;

  const chartPoints = entries.filter(x => x.raw.variant === refVariant).map(x => {
    const weights = x.raw.sets.map(s => parseFloat(s.w)).filter(n => !isNaN(n));
    return weights.length ? { date: x.k.split("__")[0], val: Math.max(...weights) } : null;
  }).filter(Boolean);

  const rows = entries.slice().reverse().slice(0, 15).map(x => {
    const sets = x.raw.sets.filter(s => s.w || s.r);
    const weights = sets.map(s => parseFloat(s.w)).filter(n => !isNaN(n));
    const topW = weights.length ? Math.max(...weights) : null;
    const date = x.k.split("__")[0];
    
    let best1RM = 0;
    sets.forEach(s => {
      const cur = calc1RM(s.w, s.r);
      if(cur > best1RM) best1RM = cur;
    });

    const setsTxt = sets.map(s => `${s.w||"0"}×${s.r||"0"}`).join("  ·  ");
    const vol = x.raw.sets.reduce((a,s) => a + (parseFloat(s.w)||0)*(parseFloat(s.r)||0), 0);
    const varTag = x.raw.variant !== ex.name ? `<span style="color:var(--accent);font-size:0.7rem"> · ${x.raw.variant}</span>` : "";

    return `
    <div class="hist-item">
      <div class="hist-item-top">
        <b>${dmy(date)}${varTag}</b>
        <span style="font-size:0.75rem;color:var(--accent-text);font-weight:750">1RM est: ${best1RM} kg</span>
      </div>
      <p>${setsTxt} ${vol ? `<span style="color:var(--text-muted)">· Vol ${Math.round(vol)} kg</span>` : ""}</p>
    </div>`;
  }).join("");

  openSheet(`
    <h2>${ex.name}</h2>
    <div class="sheet-sub">Andamento carichi e 1RM stimato</div>
    ${buildTrendChart(chartPoints)}
    <div style="margin-top:12px">${rows || '<p style="color:var(--text-muted);font-size:0.85rem">Nessun dato registrato ancora per questo esercizio.</p>'}</div>
    <button class="btn-large" onclick="closeSheet()">Chiudi</button>
  `);
}

function applyVariant(exId, variantName){
  const ex = day().ex.find(x => x.id === exId);
  const entry = exEntry(ex, true);
  if(entry.variant === variantName){ closeSheet(); return; }
  
  const hasData = entry.sets.some(s => s.w || s.r || s.d);
  if(hasData && !confirm("Cambiare variante azzera le serie inserite oggi per questo esercizio. Confermi?")) return;

  entry.variant = variantName;
  entry.sets = Array.from({length: ex.sets}, () => ({w:"",r:"",d:false}));
  Store.save();
  closeSheet();
  renderList();
  showToast(`Variante impostata: ${variantName}`);
}

function isoWeekRange(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const offset = (d.getDay() + 6) % 7;
  const monday = new Date(d); monday.setDate(d.getDate() - offset);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return [monday.toISOString().slice(0,10), sunday.toISOString().slice(0,10)];
}

function weeklySets(dateStr){
  const [start, end] = isoWeekRange(dateStr);
  const db = Store.load();
  const totals = {}; MUSCLES.forEach(m => totals[m] = 0);
  Object.keys(db.sessions).forEach(k => {
    const date = k.split("__")[0];
    if(date < start || date > end) return;
    const s = db.sessions[k];
    Object.keys(s).forEach(exId => {
      const muscle = MUSCLE_OF[exId];
      if(!muscle) return;
      const raw = s[exId];
      const setsArr = Array.isArray(raw) ? raw : (raw && raw.sets) || [];
      totals[muscle] += setsArr.filter(x => x.d).length;
    });
  });
  return {start, end, totals};
}

function openWeeklySheet(){
  const {start, end, totals} = weeklySets(state.date);
  const max = Math.max(1, ...Object.values(totals));
  const bars = MUSCLES.map(m => `
    <div class="muscle-bar">
      <span class="muscle-name">${m}</span>
      <div class="muscle-track"><i style="width:${(totals[m]/max*100).toFixed(0)}%"></i></div>
      <span class="muscle-val num">${totals[m]}</span>
    </div>`).join("");
  const hasData = Object.values(totals).some(v => v > 0);

  openSheet(`
    <h2>Volumi Settimanali</h2>
    <div class="sheet-sub">Serie allenanti completate (${dmy(start)} – ${dmy(end)})</div>
    <div style="margin-top:10px">${hasData ? bars : '<p style="color:var(--text-muted);font-size:0.85rem">Nessuna serie registrata in questa settimana.</p>'}</div>
    <button class="btn-large" onclick="closeSheet()">Chiudi</button>
  `);
}

$("btnWeekly").onclick = openWeeklySheet;

$("btnSettings").onclick = () => {
  const db = Store.load();
  const n = Object.keys(db.sessions).length;
  openSheet(`
    <h2>Impostazioni & Backup</h2>
    <div class="sheet-sub">${n} sessioni memorizzate sul tuo Galaxy S26</div>
    <button class="btn-large primary" onclick="exportData()">💾 Salva Backup (.json)</button>
    <button class="btn-large" onclick="importData()">📂 Ripristina Backup (.json)</button>
    <button class="btn-large" onclick="exportMarkdown()">📄 Esporta Scheda in Testo (Markdown)</button>
    <button class="btn-large danger" onclick="resetDay()">Azzera allenamento di oggi</button>
    <button class="btn-large danger" onclick="wipe()">Cancella tutto lo storico</button>
    <p style="font-size:0.75rem;color:var(--text-muted);margin-top:14px;line-height:1.5">
      Tutti i dati risiedono esclusivamente nel browser del tuo smartphone, senza server esterni e senza scadenze. Fai un backup periodico per sicurezza.
    </p>
    <button class="btn-large" onclick="closeSheet()">Chiudi</button>
  `);
};

function exportData(){
  const blob = new Blob([JSON.stringify(Store.load())], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `palestra-backup-${todayISO()}.json`;
  a.click();
  showToast("Backup scaricato con successo");
}

function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const obj = JSON.parse(rd.result);
        if(!obj.sessions) throw 0;
        const cur = Store.load();
        Store.replace({sessions: Object.assign({}, cur.sessions, obj.sessions)});
        closeSheet(); renderList();
        showToast("Backup ripristinato con successo!");
      }catch(e){ alert("File non valido: selezionare un backup creato da questa app."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

function exportMarkdown(){
  let md = `# Scheda Palestra\n\n`;
  PROGRAM.forEach(d => {
    md += `## ${d.title} — ${d.sub}\n\n`;
    if(d.note) md += `> ${d.note}\n\n`;
    md += `| Esercizio | Serie × Reps | Carico | Recupero | Tipo | Indicazione |\n|---|---|---|---|---|---|\n`;
    d.ex.forEach(ex => {
      md += `| ${ex.name} | ${ex.sets}×${ex.reps} | ${ex.loadTxt} | ${fmt(ex.rest)} | ${ex.eq} | ${ex.tip} |\n`;
    });
    md += "\n";
  });
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(md).then(() => showToast("Copiato negli appunti")).catch(()=>{});
  }
  const blob = new Blob([md], {type:"text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "scheda-palestra.md";
  a.click();
}

function resetDay(){
  if(!confirm("Azzerare tutte le serie dell'allenamento di oggi?")) return;
  const db = Store.load();
  delete db.sessions[sessionKey()];
  Store.save();
  closeSheet();
  renderList();
  showToast("Allenamento odierno azzerato");
}

function wipe(){
  if(!confirm("ATTENZIONE: vuoi davvero cancellare tutto lo storico? L'operazione non è reversibile.")) return;
  Store.replace({sessions:{}});
  closeSheet();
  renderList();
  showToast("Storico cancellato");
}

/* =========================================================
   8. AVVIO
   ========================================================= */
$("dateInput").value = state.date;
renderDays();
renderList();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
